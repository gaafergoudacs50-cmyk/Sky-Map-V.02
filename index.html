<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Map V.02</title>
<style>
:root { 
    --bg: #030612; 
    --fg: #cfd8ff; 
    --ui: rgba(22, 28, 48, 0.65); 
    --ui-hover: rgba(35, 45, 75, 0.85); 
    box-sizing: border-box; 
    padding-top: env(safe-area-inset-top, 0px); 
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { 
    height: 100%; 
    margin: 0; 
    background: var(--bg); 
    color: var(--fg); 
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; 
    overflow: hidden; 
}
canvas { 
    position: fixed; 
    inset: 0; 
    width: 100%; 
    height: 100%; 
    touch-action: none; 
    cursor: grab; 
}

/* Top UI Overlay */
.top-bar { 
    position: fixed; 
    top: 24px; 
    left: 24px; 
    right: 24px; 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-start; 
    pointer-events: none; 
    z-index: 10; 
}
.top-bar > * { pointer-events: auto; }

.btn-icon { 
    width: 44px; height: 44px; 
    border-radius: 12px; 
    background: var(--ui); 
    border: none; 
    color: white; 
    display: flex; justify-content: center; align-items: center; 
    backdrop-filter: blur(12px); 
    cursor: pointer; 
    transition: background 0.2s; 
}
.btn-icon:hover { background: var(--ui-hover); }
.btn-icon svg { width: 24px; height: 24px; fill: white; }

.search-container { 
    position: relative; 
    display: flex; align-items: center; 
    background: var(--ui); 
    backdrop-filter: blur(12px); 
    border-radius: 24px; 
    padding: 0 16px; 
    height: 44px; 
    width: 320px; 
}
.search-container svg { width: 18px; height: 18px; fill: #8b96ad; margin-right: 10px; }
.search-container input { 
    background: transparent; border: none; color: white; 
    font-size: 15px; outline: none; width: 100%; 
}
.search-container input::placeholder { color: #8b96ad; }

.btn-pill { 
    background: var(--ui); 
    backdrop-filter: blur(12px); 
    border: none; border-radius: 24px; 
    padding: 0 20px; height: 44px; 
    color: white; font-size: 15px; font-weight: 500; 
    display: flex; align-items: center; gap: 8px; 
    cursor: pointer; transition: background 0.2s; 
}
.btn-pill:hover { background: var(--ui-hover); }
.btn-pill svg { width: 18px; height: 18px; fill: white; }

/* Search Dropdown */
#res { 
    position: absolute; top: 52px; left: 0; right: 0; 
    background: var(--ui); backdrop-filter: blur(16px); 
    border-radius: 16px; overflow: hidden; max-height: 40vh; overflow-y: auto; 
    display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#sw.on #res { display: block; }
#res div { 
    padding: 12px 16px; cursor: pointer; display: flex; 
    justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); 
}
#res div:hover { background: rgba(255,255,255,0.1); }
#res i { color: #8b96ad; font-style: normal; font-size: 12px; }

/* Bottom UI Overlay */
.bottom-bar { 
    position: fixed; bottom: 24px; left: 24px; right: 24px; 
    display: flex; justify-content: space-between; align-items: flex-end; 
    pointer-events: none; z-index: 10; 
}
.bottom-bar > * { pointer-events: auto; }

.controls-row { 
    display: flex; gap: 6px; align-items: center; 
    position: absolute; left: 50%; transform: translateX(-50%);
}
.controls-row button { 
    background: transparent; border: none; color: white; 
    width: 44px; height: 44px; border-radius: 50%; 
    display: flex; justify-content: center; align-items: center; 
    cursor: pointer; opacity: 0.4; transition: all 0.2s; 
}
.controls-row button.on { opacity: 1; }
.controls-row button:hover { opacity: 0.8; background: rgba(255,255,255,0.05); }
.controls-row svg { width: 28px; height: 28px; fill: currentColor; }

.time-display { 
    text-align: right; font-variant-numeric: tabular-nums; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); cursor: pointer;
}
.time-display .clock { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: white;}
.time-display .date { font-size: 13px; color: #a1abc0; font-weight: 500; }

/* Info Panel */
#info {
    position: fixed; right: 24px; top: 80px; width: 280px; 
    background: var(--ui); border-radius: 16px; padding: 20px; 
    backdrop-filter: blur(12px); pointer-events: auto; 
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
#info[hidden] { display: none; }
#info h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
#info .cat { color: #7fa6ff; font-size: 12px; margin-bottom: 12px; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 0 0 12px; font-size: 13px; }
#info dt { color: #8b96ad; }
#info dd { margin: 0; font-weight: 500; }
#info p { margin: 0; font-size: 13px; line-height: 1.5; color: #cfd8ff; }
#x { position: absolute; right: 12px; top: 12px; background: none; border: none; color: white; font-size: 22px; cursor: pointer; opacity: 0.5; }
#x:hover { opacity: 1; }
</style>
</head>

    names: `<svg viewBox="0 0 24 24"><path d="M12 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-3 16h6v-6h3l-6-8-6 8h3v6z" fill="currentColor"/></svg>`,
    hor: `<svg viewBox="0 0 24 24"><path d="M3 18h18v2H3zm5-3a3 3 0 0 1-5.65-.5 4 4 0 0 1 7.3 0A3 3 0 0 1 8 15zm10 0a4 4 0 0 0-7.8-1 3 3 0 0 0 1.8 3h6z" fill="currentColor"/></svg>`,
    grid: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 3c-3 0-5.5 4-5.5 9s2.5 9 5.5 9 5.5-4 5.5-9-2.5-9-5.5-9z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3.5 12h17" stroke="currentColor" stroke-width="1.5"/></svg>`,
    ecl: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3 12c0-3.5 4-6 9-6s9 2.5 9 6-4 6-9 6-9-2.5-9-6z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
    dso: `<svg viewBox="0 0 24 24"><path d="M12 4c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8c0-1.1-.9-2-2-2s-2 .9-2 2c0 2.2-1.8 4-4 4s-4-1.8-4-4 1.8-4 4-4c1.1 0 2-.9 2-2s-.9-2-2-2z" fill="currentColor"/></svg>`,
    planets: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>`,
    fullscreen: `<svg viewBox="0 0 24 24"><path d="M5 5h4v1.5H6.5V10H5V5zm14 0h-4v1.5h2.5V10H19V5zM5 19h4v-1.5H6.5V14H5v5zm14 0h-4v-1.5h2.5V14H19v5z" fill="currentColor"/></svg>`
};

function resize(){
    const d=devicePixelRatio||1; W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0);
} 
addEventListener('resize',resize); resize();
let ct,st,cp,sp,sc,fx,fy,fz,rx,ry,ux,uy,uz;
const toH=(X,Y,Z)=>{const a=X*ct+Y*st,b=X*st-Y*ct;return[-b,Z*cp-a*sp,Z*sp+a*cp]};
const proj=v=>{const px=v[0]*rx+v[1]*ry,py=v[0]*ux+v[1]*uy+v[2]*uz,pz=v[0]*fx+v[1]*fy+v[2]*fz,k=2/(1+pz+1e-9);return[W/2+sc*k*px,H/2-sc*k*py,pz]};
const altaz=v=>[Math.asin(v[2])/R,(Math.atan2(v[0],v[1])/R+360)%360];

/* ============ RENDER ============ */
function T(t,x,y,c,f,al){g.font=f||'12px system-ui,sans-serif';g.fillStyle=c;g.textAlign=al||'left';g.fillText(t,x,y)}
function curve(fn,n){let pen=0,best=null,bd=1e9;g.beginPath();for(let i=0;i<=n;i++){const p=proj(fn(i));if(p[2]<-.6){pen=0;continue}pen?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);pen=1;
 if(p[0]>40&&p[0]<W-40&&p[1]>60&&p[1]<H-40){const d=Math.hypot(p[0]-W/2,p[1]-H/2);if(d<bd){bd=d;best=p}}}g.stroke();return best}

function draw(){
 const now=new Date(Date.now()+tOff),d=now/864e5+2440587.5-2451545;solar(d);
 const th=((280.46061837+360.98564736629*d+lon)%360)*R;ct=Math.cos(th);st=Math.sin(th);cp=Math.cos(lat*R);sp=Math.sin(lat*R);
 if(tg){const dA=((tg.A-V.A+540)%360)-180;V.A+=dA*.14;V.h+=(tg.h-V.h)*.14;V.fov*=Math.pow(tg.fov/V.fov,.14);if(Math.abs(dA)<.05&&Math.abs(tg.h-V.h)<.05&&Math.abs(Math.log(tg.fov/V.fov))<.003)tg=null}
 V.A=(V.A+360)%360;const A=V.A*R,h=V.h*R;fx=Math.cos(h)*Math.sin(A);fy=Math.cos(h)*Math.cos(A);fz=Math.sin(h);rx=Math.cos(A);ry=-Math.sin(A);ux=-Math.sin(A)*Math.sin(h);uy=-Math.cos(A)*Math.sin(h);uz=Math.cos(h);
 sc=(H/2)/(2*Math.tan(V.fov*R/4));
 
 const gr=g.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.9);
 gr.addColorStop(0,'#11192b'); gr.addColorStop(.6,'#050812'); gr.addColorStop(1,'#010204');
 g.fillStyle=gr; g.fillRect(0,0,W,H);
 
 for(const o of OBJ){o.v=toH(...o.e);o.p=proj(o.v)}
 g.lineWidth=1;
 
 if(LAY.grid){g.strokeStyle='rgba(255,255,255,.05)';for(let dc=-60;dc<=60;dc+=30)if(dc)curve(i=>toH(...eq(i/10,dc)),240);for(let r=0;r<24;r+=2)curve(i=>toH(...eq(r,-88+i*2.93)),60)}
 if(LAY.ecl){g.strokeStyle='rgba(120,200,140,.35)';let b=curve(i=>{const l=i*R*3;return toH(...ecl(Math.cos(l),Math.sin(l),0))},120);if(b)T('Ecliptic',b[0]+8,b[1]-6,'#7fbf8f');
  g.strokeStyle='rgba(120,160,255,.3)';b=curve(i=>toH(...eq(i/10,0)),240);if(b)T('Celestial equator',b[0]+8,b[1]-6,'#7f9fe0')}
 if(LAY.lines){g.strokeStyle='rgba(255,255,255,.15)';g.beginPath();for(const c of CONS)for(const l of c.lines)for(let i=1;i<l.length;i++){const a=l[i-1].p,b=l[i].p;if(a[2]>-.5&&b[2]>-.5){g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}}g.stroke()}
 
 const zs=Math.min(1.9,Math.max(.85,Math.pow(90/V.fov,.3))),lim=2.3+1.3*Math.log2(90/V.fov);
 if(LAY.dso)for(const o of OBJ)if(o.dso&&o.p[2]>-.5){const[x,y]=o.p,r=Math.max(4,7*zs);g.strokeStyle='#4fc05a';g.beginPath();
  if(o.k=='G')g.ellipse(x,y,r*1.3,r*.7,.5,0,7);else if(o.k=='N')g.rect(x-r*.8,y-r*.8,r*1.6,r*1.6);else g.arc(x,y,r,0,7);g.stroke();
  if(o.m<lim+3.5)T(o.n,x+r+3,y+3,'#4fc05a')}
 
 for(const o of OBJ)if(o.t=='Star'&&!o.pl&&o.p[2]>-.5){
  const[x,y]=o.p;if(x<-20||x>W+20||y<-20||y>H+20)continue;
  const r=Math.max(.7,(5.6-o.m)*.5*zs),al=o.v[2]<0?.45:1,c=WARM.has(o.n)?'255,220,190':BLUE.has(o.n)?'210,230,255':'255,255,255';
  if(o.m<2.2){const gl=g.createRadialGradient(x,y,0,x,y,r*4);gl.addColorStop(0,`rgba(${c},${.2*al})`);gl.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gl;g.fillRect(x-r*4,y-r*4,r*8,r*8)}
  g.fillStyle=`rgba(${c},${al})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  if(LAY.stars&&o.m<lim&&!/ (Cas|Cyg|Per|Aur|Tau|Sco|Her|UMi|Sgr|Lep)$|^Mu1|^Eps|^Zeta|^Eta|^Pi |^Tau|^Phi|^Delta|^Iota|^Theta|^Epsilon|^Gamma/.test(o.n)||o===sel)T(o.n,x+r+4,y-r-2,'#aeb8cc')}
 
 if(LAY.names)for(const o of CONS)if(o.p[2]>0)T(o.n,o.p[0],o.p[1],'#aeb8cc','13px system-ui','center');
 
 if(LAY.hor){
  // Solid Horizon Silhouette
  g.fillStyle='#020304'; 
  g.beginPath();
  let pts = [];
  // Sweep dynamically relative to current view azimuth (left to right)
  for(let i = 130; i >= -130; i -= 2){
      let az = (V.A - i + 360) % 360;
      let el = Math.sin(az*18*R)*1.2 + Math.cos(az*34*R)*0.6; 
      if(el<0) el=0;
      const p = proj([Math.cos(el*R)*Math.sin(az*R), Math.cos(el*R)*Math.cos(az*R), Math.sin(el*R)]);
      // Only include points in front of the camera
      if(p[2] > -0.2) pts.push(p);
  }
  if(pts.length > 0) {
      g.moveTo(pts[0][0], pts[0][1]);
      for(let i=1; i<pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
      
      // Close the shape cleanly below the screen
      g.lineTo(pts[pts.length-1][0], H + 1000);
      g.lineTo(pts[0][0], H + 1000);
      g.fill();
  }

  // Custom Rose Cardinal Markers
  [['N',0],['E',90],['S',180],['W',270]].forEach(([n,a])=>{
   const p=proj([Math.sin(a*R),Math.cos(a*R),0]);
   if(p[2]>-.3){
       T('•',p[0],p[1]-28,'#d17b7b','16px system-ui','center');
       T(n,p[0],p[1]-6,'#d17b7b','600 22px system-ui','center');
   }
  });
 }
 
 if(sel&&sel.p[2]>-.5){const[x,y]=sel.p;g.strokeStyle='rgba(255,255,255,0.8)';g.setLineDash([4,4]);g.beginPath();g.arc(x,y,20,0,7);g.stroke();g.setLineDash([])}
 
 if(fr++%10==0){
  const tStr = now.toLocaleTimeString('en-US',{hour12:false});
  const dStr = now.toISOString().split('T')[0];
  $('clock').textContent = tStr;
  $('date').textContent = dStr;
  if(sel)panel();
 }
 requestAnimationFrame(draw);
}

/* ============ INTERACTION ============ */
const fmtRA=x=>{let h=(((Math.atan2(x[1],x[0])/R)/15)+24)%24,m=(h%1)*60;return`${Math.floor(h)}h ${m.toFixed(1)}m`};
const fmtD=x=>{const d=Math.asin(x[2])/R,s=d<0?'−':'+',a=Math.abs(d);return`${s}${Math.floor(a)}° ${((a%1)*60).toFixed(1)}′`};
function panel(){const o=sel,[al,az]=altaz(o.v);$('in').textContent=o.n;$('ic').textContent=o.t+(o.a&&o.dso?' · '+o.a:'')+(o.con?' · '+o.con:'');
 $('idl').innerHTML=`<dt>RA</dt><dd>${fmtRA(o.e)}</dd><dt>Dec</dt><dd>${fmtD(o.e)}</dd><dt>Altitude</dt><dd>${al.toFixed(1)}°${al<0?' (below horizon)':''}</dd><dt>Azimuth</dt><dd>${az.toFixed(1)}°</dd>`+(o.m<50&&o!==MOON?`<dt>Magnitude</dt><dd>${o.m}</dd>`:'');
 $('ids').textContent=o.desc||`A star${o.con?' in '+o.con:''}, magnitude ${o.m}.`}
function select(o,fly){sel=o;$('info').hidden=!o;if(!o)return;panel();if(fly){const[al,az]=altaz(o.v);tg={A:az,h:Math.max(-60,Math.min(80,al)),fov:o.cn?Math.max(Math.min(V.fov,70),45):Math.min(V.fov,45)}}}
function pick(x,y){let b=null,bd=26;for(const o of OBJ){if(o.cn||o.p[2]<-.3||(o.pl&&!LAY.planets)||(o.dso&&!LAY.dso))continue;const d=Math.hypot(o.p[0]-x,o.p[1]-y)+(o.m>4?3:0);if(d<bd){bd=d;b=o}}select(b,false)}
const pt=new Map();let pd=0;const dist=()=>{const a=[...pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);tg=null;moved=0;if(pt.size==2)pd=dist()};
cv.onpointermove=e=>{const o=pt.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];pt.set(e.pointerId,[e.clientX,e.clientY]);
 if(pt.size==1){moved+=Math.abs(dx)+Math.abs(dy);const k=V.fov/H;V.A-=dx*k/Math.max(.25,Math.cos(V.h*R));V.h=Math.max(-89,Math.min(89,V.h+dy*k))}
 else if(pt.size==2){const d=dist();V.fov=Math.max(3,Math.min(170,V.fov*pd/d));pd=d;moved=99}};
cv.onpointerup=cv.onpointercancel=e=>{if(pt.size==1&&moved<5)pick(e.clientX,e.clientY);pt.delete(e.pointerId)};
cv.addEventListener('wheel',e=>{e.preventDefault();tg=null;V.fov=Math.max(3,Math.min(170,V.fov*Math.exp(e.deltaY*.0012)))},{passive:false});

/* Initialize UI */
$('side').innerHTML = Object.entries(ICONS).map(([k, svg]) => 
    `<button data-k="${k}" class="${LAY[k] ? 'on' : ''}">${svg}</button>`
).join('');

$('side').onclick=e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    const k = btn.dataset.k;
    if(k === 'fullscreen') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); return; }
    if(k) { LAY[k] = !LAY[k]; btn.classList.toggle('on', !!LAY[k]); }
};

$('tm').onclick=()=>tOff+=3600000;
$('x').onclick=()=>select(null);
$('sw').onclick=()=>{$('sw').classList.toggle('on');if($('sw').classList.contains('on'))$('q').focus()};
$('menu-btn').onclick=()=>alert('Observatory Dashboard & Settings would open here.');

function search(){const q=$('q').value.trim().toLowerCase(),r=$('res');r.innerHTML='';if(!q)return[];
 const hits=OBJ.filter(o=>(o.n+' '+(o.a||'')).toLowerCase().includes(q)).sort((a,b)=>(a.n.toLowerCase().startsWith(q)?0:1)-(b.n.toLowerCase().startsWith(q)?0:1)||a.m-b.m).slice(0,8);
 hits.forEach(o=>{const d=document.createElement('div');d.innerHTML=`<span>${o.n}${o.a&&o.dso?' — '+o.a:''}</span><i>${o.t}</i>`;d.onclick=e=>{e.stopPropagation();select(o,true);$('q').value='';r.innerHTML='';$('sw').classList.remove('on')};r.appendChild(d)});return hits}
$('q').oninput=search;$('q').onkeydown=e=>{if(e.key=='Enter'){const h=search();if(h[0])$('res').firstChild.click()}else if(e.key=='Escape')$('sw').classList.remove('on')};

requestAnimationFrame(draw);
</script>
</body>
